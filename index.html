<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Betting Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Place Your Bet</h1>
    <div class="match">
        <h2>Team A vs. Team B</h2>
        <div class="odds">
            <p>Team A to win: <span id="odds-a">1.5</span></p>
            <p>Draw: <span id="odds-draw">3.0</span></p>
            <p>Team B to win: <span id="odds-b">2.5</span></p>
        </div>
        <form id="betting-form">
            <label for="team">Select Team:</label>
            <select id="team" name="team">
                <option value="a">Team A</option>
                <option value="draw">Draw</option>
                <option value="b">Team B</option>
            </select>
            <label for="amount">Bet Amount:</label>
            <input type="number" id="amount" name="amount" min="1" required>
            <button type="submit">Place Bet</button>
        </form>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
